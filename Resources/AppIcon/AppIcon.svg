    <circle cx="470" cy="470" r="262" stroke-width="34"/>
  </g>
  <!-- 校验徽章：出口符合预期 -->
  <circle cx="724" cy="724" r="150" fill="#2fbf71" stroke="#123352" stroke-width="30"/>
  <path d="M654 726 L705 777 L800 676" fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
