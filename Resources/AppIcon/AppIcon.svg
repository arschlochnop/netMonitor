<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21598a"/>
      <stop offset="1" stop-color="#0d2741"/>
    </linearGradient>
    <clipPath id="globeClip"><circle cx="470" cy="470" r="262"/></clipPath>
  </defs>
  <!-- macOS 图标网格：824×824 圆角方形 -->
