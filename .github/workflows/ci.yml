name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift 版本
        run: swift --version

      - name: 单元测试
        run: swift test

      - name: 打包 .app
        run: |
          VERSION="0.1.0-dev"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          scripts/build-app.sh "$VERSION"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: NetMonitor
          path: build/*.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
